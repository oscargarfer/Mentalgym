appId: com.oscargarcia.gimnasiomental
productName: Gimnasio Mental
copyright: © 2026 Oscar Garcia. Todos los derechos reservados.

directories:
  output: release
  buildResources: assets

# Solo lo que la app necesita para arrancar: ni los guiones de vocabulario, ni
# el servidor local, que en la app instalada no pintan nada.
#
# node_modules se excluye entero a propósito. Vite ya empaqueta toda la interfaz
# dentro de dist/, y el proceso principal solo usa `electron` y módulos de Node.
# Sin esta línea se colarían los plugins de Capacitor —con sus fuentes de
# Android y de iOS— dentro de una aplicación de escritorio.
files:
  - dist/**/*
  - electron/**/*
  - package.json
  - '!**/*.map'
  - '!node_modules/**/*'

win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/gimnasio.ico
  # Sin espacios en el nombre del archivo descargado. El .deb se deja con el
  # suyo por defecto, que sigue la convención de Debian
  # (gimnasio-mental_1.1.0_amd64.deb) y conviene respetar.
  artifactName: Gimnasio-Mental-${version}-windows-${arch}.${ext}
  # Sin certificado de firma: Windows mostrará el aviso de SmartScreen la
  # primera vez. Quitarlo exige un certificado de pago.
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false # instala para el usuario: no pide permisos de administrador
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Gimnasio Mental
  installerIcon: assets/gimnasio.ico
  uninstallerIcon: assets/gimnasio.ico
  installerHeaderIcon: assets/gimnasio.ico
  # Desinstalar no debe borrar el progreso: está en %APPDATA%, fuera del
  # directorio de instalación, y no se toca.
  deleteAppDataOnUninstall: false

linux:
  target:
    - target: deb
      arch: [x64]
  icon: assets/linux
  category: Education
  # Debian exige un mantenedor con correo; sin él el .deb no se genera.
  maintainer: Oscar Garcia <oscar.garfer06@gmail.com>
  synopsis: Cuaderno de entrenamiento de la memoria
  description: >-
    Entrena cuatro capacidades: asociar, ordenar, retener y procesar. Usa la
    tecnica de los atletas de memoria -asociacion inverosimil, palacio de la
    memoria, casillero numerico y repaso espaciado-, que sirve para cualquier
    material: vocabulario, numeros, cartas o textos. Cada sesion se mide y se
    registra. Funciona sin conexion y no envia ningun dato a ninguna parte.

deb:
  # Electron necesita estas bibliotecas del sistema; sin declararlas, el paquete
  # instala pero la ventana no abre.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libsecret-1-0
